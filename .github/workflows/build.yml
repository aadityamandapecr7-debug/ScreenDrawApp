name: Build APK
on: { push: { branches: [main, master] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ScreenDraw.zip
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.4' }
      - run: gradle assembleDebug
        working-directory: ScreenDraw
      - uses: actions/upload-artifact@v4
        with: { name: ScreenDraw-apk, path: ScreenDraw/app/build/outputs/apk/debug/app-debug.apk }
